<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HOME.UI</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#cfd8f7;
}

.container{
    width:95%;
    margin:auto;
    padding:40px;
    display:grid;
    grid-template-columns: 280px 1fr 350px;
    gap:60px;
}

.left{
    display:flex;
    flex-direction:column;
    gap:45px;
}

.pageButton{
    display:flex;
    justify-content:center;
    align-items:center;
    width:310px;
    height:72px;
    background:white;
    border-radius:40px;
    text-decoration:none;
    color:black;
    font-size:24px;
    box-shadow:0 0 20px rgba(255,255,255,.9);
    transition:.25s;
}

.pageButton:hover{
    transform:scale(1.04);
}

.center{
    display:flex;
    flex-direction:column;
}

.frase{
    text-align:center;
    font-size:52px;
    font-weight:bold;
    margin-bottom:35px;
}

.pagelink{
    display:flex;
    align-items:center;
    gap:25px;
    margin:18px 0;
    text-decoration:none;
    color:black;
    font-size:38px;
    font-weight:bold;
}

.circle{
    width:62px;
    height:62px;
    border-radius:50%;
    border:2px solid #b8bfd8;
}

.right{
    display:flex;
    flex-direction:column;
    gap:60px;
}

.other{
    display:flex;
    justify-content:center;
    align-items:center;
    width:100%;
    height:220px;
    background:#efefef;
    border-radius:30px;
    text-decoration:none;
    color:black;
    font-size:40px;
    font-weight:bold;
    box-shadow:0 0 20px rgba(255,255,255,.9);
    transition:.25s;
}

.other:hover{
    transform:scale(1.03);
}

.bottom{
    margin-top:80px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.buttons{
    display:flex;
    gap:18px;
}

.smallButton{
    width:95px;
    height:95px;
    border-radius:18px;
    background:#efefef;
    display:flex;
    justify-content:center;
    align-items:center;
    text-decoration:none;
    color:black;
    font-size:22px;
    box-shadow:0 0 15px rgba(255,255,255,.8);
    transition:.25s;
}

.smallButton:hover{
    transform:scale(1.08);
}

.frase2{
    font-size:50px;
    font-weight:bold;
    margin-right:250px;
}

@media(max-width:1000px){

.container{
grid-template-columns:1fr;
}

.pageButton{
width:100%;
}

.right{
width:100%;
}

.bottom{
flex-direction:column;
gap:40px;
}

.frase2{
margin-right:0;
}

}

</style>

</head>
<body>

<div class="container">

<div class="left">
